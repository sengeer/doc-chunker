[project]
name = "doc-chunker"
version = "1.0.0"
description = "Семантическая нарезка документов на чанки по бюджету токенов для LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.7",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.0"]

[project.scripts]
doc-chunker = "doc_chunker.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
